name: Build and Test sonic-mgmt

on:
  pull_request:
  workflow_dispatch:
    inputs:
      validation_timeout:
        description: 'Validation timeout in minutes'
        required: false
        type: number
        default: 45

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  validation:
    name: Validation Checks
    runs-on: cloudstack-ubuntu24-large
    timeout-minutes: ${{ inputs.validation_timeout || 45 }}

    steps:
      - name: Checkout sonic-mgmt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # Install system dependencies
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-dev libffi-dev libssl-dev build-essential

          # Install Python dependencies
          pip3 install --upgrade pip
          pip3 install ipaddr natsort pyyaml jinja2 netaddr six tabulate prettytable

      - name: "Dependency Check"
        run: |
          set -e
          echo "::group::Running dependency check"
          python3 ./.azure-pipelines/dependency_check/dependency_check.py tests || {
            echo "::warning::Dependency check failed (non-blocking)"
            exit 0
          }
          echo "::endgroup::"

      - name: "Markers Check"
        run: |
          set -e
          echo "::group::Running markers check"
          python3 ./.azure-pipelines/markers_check/markers_check.py tests
          echo "::endgroup::"

      - name: "Meta Check - Ansible Metadata Validation"
        run: |
          set -e
          echo "::group::Running meta check"
          python3 ./ansible/scripts/meta/meta_validator.py -r errors -c .azure-pipelines/meta_validator.yml || {
            echo "::warning::Meta check failed"
            exit 0
          }
          echo "::endgroup::"

      - name: "Validation Summary"
        if: success()
        run: |
          echo "::notice:: All validation checks passed!"

  pytest-collection:
    name: Pytest Collection
    runs-on: cloudstack-ubuntu24-large
    timeout-minutes: 30
    container:
      image: sonicdev-microsoft.azurecr.io:443/docker-sonic-mgmt:latest
      options: --user root

    steps:
      - name: Checkout sonic-mgmt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run pytest collection
        run: |
          set -e
          echo "::group::Running pytest --collect-only"
          cd tests
          python3 -m pytest --inventory ../ansible/veos_vtb --host-pattern all \
            --testbed_file vtestbed.yaml --testbed vms-kvm-t0 \
            --ignore saitests --ignore ptftests --ignore acstests \
            --ignore scripts --ignore k8s --ignore sai_qualify --ignore common \
            --ignore-conditional-mark \
            --color=no --collect-only --continue-on-collection-errors
          echo "::endgroup::"

      - name: "Pytest Collection Summary"
        if: success()
        run: |
          echo "::notice::Pytest collection passed!"
