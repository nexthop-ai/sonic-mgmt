# A fabric-attached test server has no trunk NIC to hang VLAN subinterfaces off; the
# DUT front panel ports are per-port veths tc-redirected to the vxlan netdevs instead.
- name: Setup front panel veths for fabric-attached test server
  fp_veth_port:
    fp_prefix: "{{ hostvars[dut_name].dut_fp_prefix }}"
    vlan_ids: "{{ device_vlan_map_list[dut_name] | filter_by_dut_interfaces(dut_interfaces | default('')) }}"
    vnis: "{{ hostvars[dut_name].dut_fp_vnis }}"
    cmd: "create"
  become: yes
  when: hostvars[dut_name].dut_fp_prefix is defined

- name: Setup vlan port for vlan tunnel
  vlan_port:
    external_port: "{{ external_port }}"
    vlan_ids: "{{ device_vlan_map_list[dut_name] | filter_by_dut_interfaces(dut_interfaces | default('')) }}"
    cmd: "create"
  become: yes
  when: hostvars[dut_name].dut_fp_prefix is not defined

- set_fact:
    duts_fp_ports: "{{ duts_fp_ports|default({}) | combine( { dut_name: dut_fp_ports } ) }}"
